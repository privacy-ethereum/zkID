[package]
name = "openac-demo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
ecdsa-spartan2 = { path = "../ecdsa-spartan2", default-features = false }
# Named directly (matching ecdsa-spartan2's own dependency exactly) so AppState
# can hold typed VerifierKey/proof fields across requests instead of reloading
# per request; ecdsa-spartan2 re-exports the loader functions but not the types.
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
ff = { version = "0.13.0", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.8"
