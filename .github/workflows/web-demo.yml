name: web-demo

on:
  push:
    branches: [main]
    paths:
      - 'wallet-unit-poc/web-demo/**'
      - 'wallet-unit-poc/openac-sdk/src/**'
      - '.github/workflows/web-demo.yml'
  pull_request:
    paths:
      - 'wallet-unit-poc/web-demo/**'
      - 'wallet-unit-poc/openac-sdk/src/**'
      - '.github/workflows/web-demo.yml'

jobs:
  lint-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-unit-poc/web-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wallet-unit-poc/web-demo/package-lock.json

      - name: Install openac-sdk dependencies
        working-directory: wallet-unit-poc/openac-sdk
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
