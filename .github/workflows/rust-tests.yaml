name: rust-tests

on:
    push:
        branches:
            - main
            - RSA-X.509-Cert
        paths:
            - "wallet-unit-poc/ecdsa-spartan2/**"
            - "wallet-unit-poc/zkid-input-builder/**"
            - "wallet-unit-poc/spartan2-wasm/**"
            - "wallet-unit-poc/circom/circuits/**"
            - ".github/workflows/rust-tests.yaml"
            - ".github/workflows/compile-circuits.yaml"
    pull_request:
        paths:
            - "wallet-unit-poc/ecdsa-spartan2/**"
            - "wallet-unit-poc/zkid-input-builder/**"
            - "wallet-unit-poc/spartan2-wasm/**"
            - "wallet-unit-poc/circom/circuits/**"
            - ".github/workflows/rust-tests.yaml"
            - ".github/workflows/compile-circuits.yaml"
    workflow_dispatch:

jobs:
    compile-circuits:
        uses: ./.github/workflows/compile-circuits.yaml
        permissions:
            contents: write
            pull-requests: write

    rust-tests:
        needs: compile-circuits
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v5

            - name: Download circuit C++ artifacts
              uses: actions/download-artifact@v4
              with:
                  name: circuit-cpp
                  path: wallet-unit-poc/circom/build/cpp/

            - name: Download R1CS artifacts
              uses: actions/download-artifact@v4
              with:
                  name: circuit-r1cs
                  path: wallet-unit-poc/circom/build/

            - name: Download circuit WASM artifacts
              uses: actions/download-artifact@v4
              with:
                  name: circuit-wasm
                  path: wallet-unit-poc/circom/build/

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes \
                    build-essential \
                    libgmp-dev \
                    libsodium-dev \
                    nasm \
                    nlohmann-json3-dev

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Cargo registry and git
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: rust-tests-cargo-${{ hashFiles('wallet-unit-poc/ecdsa-spartan2/Cargo.lock') }}
                  restore-keys: |
                      rust-tests-cargo-

            # === cert-chain RSA-2048 issuer + user-sig RSA-2048 user ===

            - name: Generate split inputs (RS2048)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  RUST_LOG=info cargo run --release -- generate-split-input

            - name: Run e2e flow — cert-chain (RS2048)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  cargo run --release --features cert_chain_rs2048 -- cert-chain setup --input ../circom/inputs/cert_chain_rs2048/input.json
                  cargo run --release --features cert_chain_rs2048 -- cert-chain prove --input ../circom/inputs/cert_chain_rs2048/input.json
                  cargo run --release --features cert_chain_rs2048 -- cert-chain verify

            - name: Run e2e flow — user-sig (RS2048)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  cargo run --release -- user-sig setup --input ../circom/inputs/user_sig_rs2048/input.json
                  cargo run --release -- user-sig prove --input ../circom/inputs/user_sig_rs2048/input.json
                  cargo run --release -- user-sig verify

            - name: Link-verify (RS2048)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  RUST_LOG=info cargo run --release -- link-verify

            # === cert-chain 4096-bit issuer + user-sig 2048-bit user ===

            - name: Generate split inputs (RS4096)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  RUST_LOG=info cargo run --release -- generate-split-input --cert-chain-4096

            - name: Run e2e flow — cert-chain (RS4096)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  cargo run --release --features cert_chain_rs4096 -- cert-chain setup --cert-chain-4096 --input ../circom/inputs/cert_chain_rs4096/input.json
                  cargo run --release --features cert_chain_rs4096 -- cert-chain prove --cert-chain-4096 --input ../circom/inputs/cert_chain_rs4096/input.json
                  cargo run --release --features cert_chain_rs4096 -- cert-chain verify --cert-chain-4096

            - name: Run e2e flow — user-sig (RS4096 chain)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  cargo run --release --features user_sig_rs2048 -- user-sig setup --input ../circom/inputs/user_sig_rs2048_chain_rs4096/input.json
                  cargo run --release --features user_sig_rs2048 -- user-sig prove --input ../circom/inputs/user_sig_rs2048_chain_rs4096/input.json
                  cargo run --release --features user_sig_rs2048 -- user-sig verify

            - name: Link-verify (RS4096)
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  RUST_LOG=info cargo run --release -- link-verify --cert-chain-4096

            # === Unit tests ===

            - name: Run ecdsa-spartan2 unit tests
              run: |
                  cd wallet-unit-poc/ecdsa-spartan2
                  cargo test --release

            - name: Run zkid-input-builder unit tests
              run: |
                  cd wallet-unit-poc/zkid-input-builder
                  cargo test --release

            - name: Run spartan2-wasm input-builder drift test
              run: |
                  cd wallet-unit-poc/spartan2-wasm
                  cargo test --release --test input_builder_drift

            # === Release artifacts ===

            - name: Gzip release artifacts
              run: |
                  set -euo pipefail
                  cd wallet-unit-poc/ecdsa-spartan2/keys
                  for f in cert_chain_rs2048_proving.key cert_chain_rs2048_verifying.key \
                           cert_chain_rs4096_proving.key cert_chain_rs4096_verifying.key \
                           user_sig_rs2048_proving.key user_sig_rs2048_verifying.key; do
                    gzip -k "$f"
                  done
                  cd "$GITHUB_WORKSPACE/wallet-unit-poc/circom/build"
                  for circuit in certChainRS2048 certChainRS4096 userSigRS2048; do
                    gzip -k "${circuit}/${circuit}_js/${circuit}.r1cs"
                    gzip -k "${circuit}/${circuit}_js/${circuit}.wasm"
                  done
                  # Identical across all three circuits; ship one copy.
                  cp certChainRS2048/certChainRS2048_js/witness_calculator.js witness_calculator.js
                  gzip -k witness_calculator.js
                  cd cpp
                  for f in *.cpp *.dat; do
                    gzip -k "$f"
                  done

            - name: Upload artifacts to GitHub Release
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/RSA-X.509-Cert')
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  make_latest: false
                  files: |
                      wallet-unit-poc/ecdsa-spartan2/keys/cert_chain_rs2048_proving.key.gz
                      wallet-unit-poc/ecdsa-spartan2/keys/cert_chain_rs2048_verifying.key.gz
                      wallet-unit-poc/ecdsa-spartan2/keys/cert_chain_rs4096_proving.key.gz
                      wallet-unit-poc/ecdsa-spartan2/keys/cert_chain_rs4096_verifying.key.gz
                      wallet-unit-poc/ecdsa-spartan2/keys/user_sig_rs2048_proving.key.gz
                      wallet-unit-poc/ecdsa-spartan2/keys/user_sig_rs2048_verifying.key.gz
                      wallet-unit-poc/circom/build/certChainRS2048/certChainRS2048_js/certChainRS2048.r1cs.gz
                      wallet-unit-poc/circom/build/certChainRS4096/certChainRS4096_js/certChainRS4096.r1cs.gz
                      wallet-unit-poc/circom/build/userSigRS2048/userSigRS2048_js/userSigRS2048.r1cs.gz
                      wallet-unit-poc/circom/build/cpp/certChainRS2048.cpp.gz
                      wallet-unit-poc/circom/build/cpp/certChainRS2048.dat.gz
                      wallet-unit-poc/circom/build/cpp/certChainRS4096.cpp.gz
                      wallet-unit-poc/circom/build/cpp/certChainRS4096.dat.gz
                      wallet-unit-poc/circom/build/cpp/userSigRS2048.cpp.gz
                      wallet-unit-poc/circom/build/cpp/userSigRS2048.dat.gz
                      wallet-unit-poc/circom/build/certChainRS2048/certChainRS2048_js/certChainRS2048.wasm.gz
                      wallet-unit-poc/circom/build/certChainRS4096/certChainRS4096_js/certChainRS4096.wasm.gz
                      wallet-unit-poc/circom/build/userSigRS2048/userSigRS2048_js/userSigRS2048.wasm.gz
                      wallet-unit-poc/circom/build/witness_calculator.js.gz
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
