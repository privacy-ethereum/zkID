name: compile-circuits

on:
    workflow_call:
        inputs:
            circom-version:
                description: "Circom binary version to download"
                required: false
                type: string
                default: "v2.2.3"

jobs:
    compile-circuits:
        runs-on: macos-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"
                  cache-dependency-path: wallet-unit-poc/circom/yarn.lock

            - name: Install system dependencies
              run: brew install nasm

            - name: Download Circom Binary ${{ inputs.circom-version }}
              run: |
                  set -euo pipefail
                  sudo wget -O ~/.cargo/bin/circom https://github.com/iden3/circom/releases/download/${{ inputs.circom-version }}/circom-macos-amd64
                  sudo chmod +x ~/.cargo/bin/circom

            - name: Print Circom version
              run: circom --version

            - name: Install JS dependencies
              run: cd wallet-unit-poc/circom && yarn

            - name: Compile all circuits
              run: cd wallet-unit-poc/circom && yarn compile:all

            - name: Check circuit artifacts against committed version
              id: check-artifacts
              run: |
                  set -euo pipefail
                  BUILD_CPP="wallet-unit-poc/circom/build/cpp"
                  CIRCUITS_DIR="wallet-unit-poc/ecdsa-spartan2/circuits"
                  changed=false
                  for file in certChainRS2048.cpp certChainRS2048.dat certChainRS4096.cpp certChainRS4096.dat userSigRS2048.cpp userSigRS2048.dat; do
                    built="$BUILD_CPP/$file"
                    committed="$CIRCUITS_DIR/$file"
                    if [ ! -f "$built" ]; then
                      echo "Warning: compiled file $file not found, skipping"
                      continue
                    fi
                    if ! diff -q "$built" "$committed" > /dev/null 2>&1; then
                      echo "  changed: $file"
                      cp "$built" "$committed"
                      changed=true
                    fi
                  done
                  echo "circuits_changed=$changed" >> "$GITHUB_OUTPUT"

            - name: Open PR to update circuit artifacts
              if: steps.check-artifacts.outputs.circuits_changed == 'true'
              run: |
                  set -euo pipefail
                  TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
                  UPDATE_BRANCH="ci/update-circuits-$(date +%Y%m%d-%H%M%S)"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  git checkout -b "$UPDATE_BRANCH"
                  git add wallet-unit-poc/ecdsa-spartan2/circuits/
                  git commit -m "chore(circuits): update cpp/dat artifacts to current compiled version"
                  git push origin "$UPDATE_BRANCH"
                  gh pr create \
                    --title "chore(circuits): update circuit cpp/dat artifacts" \
                    --body "Automated update: \`wallet-unit-poc/ecdsa-spartan2/circuits/\` cpp/dat files are out of sync with the current compiled output. This PR brings them up to date." \
                    --base "$TARGET_BRANCH" \
                    --head "$UPDATE_BRANCH"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload circuit C++ artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: circuit-cpp
                  path: |
                      wallet-unit-poc/circom/build/cpp/certChainRS2048.cpp
                      wallet-unit-poc/circom/build/cpp/certChainRS2048.dat
                      wallet-unit-poc/circom/build/cpp/certChainRS4096.cpp
                      wallet-unit-poc/circom/build/cpp/certChainRS4096.dat
                      wallet-unit-poc/circom/build/cpp/userSigRS2048.cpp
                      wallet-unit-poc/circom/build/cpp/userSigRS2048.dat
                  retention-days: 3

            - name: Upload R1CS artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: circuit-r1cs
                  path: |
                      wallet-unit-poc/circom/build/certChainRS2048/certChainRS2048_js/certChainRS2048.r1cs
                      wallet-unit-poc/circom/build/certChainRS4096/certChainRS4096_js/certChainRS4096.r1cs
                      wallet-unit-poc/circom/build/userSigRS2048/userSigRS2048_js/userSigRS2048.r1cs
                  retention-days: 3

            - name: Upload circuit WASM artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: circuit-wasm
                  path: |
                      wallet-unit-poc/circom/build/certChainRS2048/certChainRS2048_js/certChainRS2048.wasm
                      wallet-unit-poc/circom/build/certChainRS4096/certChainRS4096_js/certChainRS4096.wasm
                      wallet-unit-poc/circom/build/userSigRS2048/userSigRS2048_js/userSigRS2048.wasm
                      wallet-unit-poc/circom/build/certChainRS2048/certChainRS2048_js/witness_calculator.js
                      wallet-unit-poc/circom/build/certChainRS4096/certChainRS4096_js/witness_calculator.js
                      wallet-unit-poc/circom/build/userSigRS2048/userSigRS2048_js/witness_calculator.js
                  retention-days: 3
